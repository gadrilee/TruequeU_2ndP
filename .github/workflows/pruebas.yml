name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trueque-u/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trueque-u/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter test
