name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trueque-u/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trueque-u/backend/package-lock.json
      - run: npm ci
      - run: npx jest --coverage --ci

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trueque-u/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      # The .env asset is declared in pubspec.yaml and is git-ignored.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter test --coverage
      - run: dart run tool/cobertura.dart 0
