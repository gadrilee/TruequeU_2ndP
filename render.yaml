services:
  - type: web
    name: trueque-u-api
    runtime: node
    plan: free
    rootDir: trueque-u/backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUERTO
        value: "10000"
      - key: JWT_SECRETO
        generateValue: true
      - key: BD_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORREO_USUARIO
        sync: false
      - key: CORREO_CLAVE
        sync: false
